services:
  mongodb:
    image: mongo:7.0
    container_name: scoutvision-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=scoutvision
    volumes:
      - mongodb_data:/data/db
    networks:
      - scoutvision-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo-express:
    image: mongo-express:latest
    container_name: scoutvision-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - scoutvision-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scoutvision-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:3000
      - MONGODB_URI=mongodb://mongodb:27017/scoutvision
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - scoutvision-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scoutvision-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - scoutvision-network

networks:
  scoutvision-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
